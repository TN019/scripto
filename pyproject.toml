[project]
name = "scripto"
version = "0.1.0"
description = "Local, free batch audio/video transcription and subtitle translation for macOS and Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TN019" }]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0",
    "huggingface_hub>=0.23",
    "tqdm>=4.66",
    "faster-whisper>=1.1",
    "mlx-whisper>=0.4.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "flet[desktop]>=0.86.0",  # [desktop] pins flet-desktop in the lock — a bare
    # "flet" leaves the viewer as an orphan that any exact `uv sync` removes
    # Close-to-Dock: hides the viewer app via NSRunningApplication.
    "pyobjc-framework-cocoa>=10; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/TN019/scripto"
Issues = "https://github.com/TN019/scripto/issues"

[project.scripts]
scripto = "scripto.app:main"
scripto-cli = "scripto.cli:main"

[dependency-groups]
dev = [
    "flet-web>=0.86.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
