[project]
name = "scripto"
version = "0.1.0"
description = "Local, free batch audio/video transcription and subtitle translation for macOS and Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0",
]

[project.scripts]
scripto = "scripto.app:main"
scripto-cli = "scripto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
