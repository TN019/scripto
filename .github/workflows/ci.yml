name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PySide6 imports need the Qt runtime libraries even offscreen.
      - name: Install Qt runtime libraries (headless)
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # Fast suite only: real-engine / Ollama smokes are gated behind
      # SCRIPTO_ENGINE_SMOKE / SCRIPTO_OLLAMA_SMOKE and never run in CI
      # (they download models and need a GPU / running Ollama).
      - name: Run tests
        run: uv run pytest -q
